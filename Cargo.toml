[package]
name = "ars_learn"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    "ws-web/axum-web-a",
    "ws-web/ntex-web-a",
    "ws-web/ntex-web-diesel-async",
    "ws-web/web-socket",
    "ws-web/ntex-yew",
    "ws-web/tide-a",
    "ws-web/actix-web-a",
    "ws-rs/rayon-demo",
    "ws-rs/insta-a",
    "ws-tools/toml_setting",
    "ws-tools/clap-demo",
    "ws-middleware/governor-demo",
    "ws-middleware/crossbeam-demo",
    "ws-middleware/pnet-demo",
    "ws-middleware/async-log-watch-a",
    "ws-middleware/kafka-a",
    "ws-middleware/redis-a",
    "ws-middleware/AMQP-a",
    "ws-middleware/DTT-a",
    "ws-middleware/log4rs-a",
    "ws-middleware/pingora-a",
    "ws-middleware/rate-limiter",
    "ws-middleware/gui-druid",
    "ws-tyr/rs-http",
    "ws-tools/syntect-demo",
    "ws-tools/prost-demo",
    "ws-tyr/Thumbor",
    "ws-tools/grpc-tonic",
]

# [[bin]]
# name = "ws-server"
# path = "projs/web-socket/src/ws_server"

[dependencies]
tokio = { version = "1.33.0", features = ["full"] }
config = "0.14.0"


# build release opt
[profile.release]
lto = true
opt-level = 'z'
strip = true
codegen-units = 1
