[package]
name = "tokio-stream"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tcp-server"
path = "src/server.rs"

[[bin]]
name = "tcp-client"
path = "src/client.rs"

[dependencies]
anyhow = "1.0.83"
futures = "0.3.30"
bytes = "1.6.0"
tokio = { version = "1.37.0", features = ["full"] }
tokio-util = { version = "0.7.11", features = ["codec"] }
prost = "0.12.4"

[build-dependencies]
prost-build = "0.12.4"